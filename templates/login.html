<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f8eaea',
                            100: '#f2d4d4',
                            500: '#8A0000',
                            600: '#730000',
                            700: '#5f0000',
                            900: '#2b0f10'
                        }
                    },
                    fontFamily: {
                        body: ['Satoshi', 'system-ui', 'sans-serif'],
                        heading: ['Syne', 'Satoshi', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <title>Administration — Connexion</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="flex min-h-screen items-center justify-center px-4 py-10">
        <div class="w-full max-w-md rounded-[2rem] border border-slate-800/80 bg-slate-950/90 p-8 shadow-2xl shadow-slate-950/40 backdrop-blur-xl">
            <div class="mb-6 text-center">
                <p class="text-xs uppercase tracking-[0.35em] text-slate-500">Accès Administratif</p>
                <h1 class="mt-3 text-3xl font-semibold tracking-tight text-white">Connexion</h1>
                <p class="mt-2 text-sm text-slate-400">Connectez-vous pour gérer les événements et les publications du site.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="space-y-3 mb-6">
                        {% for category, message in messages %}
                            <div class="rounded-3xl border px-4 py-3 text-sm font-medium {% if category == 'error' %}border-rose-500/30 bg-rose-500/10 text-rose-100{% elif category == 'warning' %}border-amber-500/30 bg-amber-500/10 text-amber-100{% elif category == 'success' %}border-emerald-500/30 bg-emerald-500/10 text-emerald-100{% else %}border-slate-700/70 bg-slate-800/80 text-slate-100{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
                <div>
                    <label for="username" class="mb-2 block text-sm font-semibold text-slate-200">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required autofocus class="w-full rounded-3xl border border-slate-700/80 bg-slate-900/90 px-4 py-3 text-slate-100 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20" />
                </div>
                <div>
                    <label for="password" class="mb-2 block text-sm font-semibold text-slate-200">Mot de passe</label>
                    <input type="password" id="password" name="password" required class="w-full rounded-3xl border border-slate-700/80 bg-slate-900/90 px-4 py-3 text-slate-100 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20" />
                </div>
                <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                    <button type="submit" class="inline-flex w-full items-center justify-center rounded-full bg-brand-500 px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500/40 sm:w-auto">Connexion</button>
                    <a href="{{ url_for('login') }}" class="inline-flex w-full items-center justify-center rounded-full border border-slate-700/80 bg-slate-900/90 px-6 py-3 text-sm font-semibold text-slate-200 transition hover:border-slate-500 sm:w-auto">Retour</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
